<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام إدارة احتياج وتوافر المواد - مديرية صحة طرطوس</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#12312b;
    --paper:#f6f4ee;
    --card:#ffffff;
    --teal:#0f5c56;
    --teal-dark:#0a3d3a;
    --gold:#b8873f;
    --line:#e1ddd0;
    --muted:#6b7268;
    --red-bg:#fbdede; --red-fg:#8a1f1f;
    --yellow-bg:#fbeec9; --yellow-fg:#7a5b06;
    --green-bg:#dcefdd; --green-fg:#1e5c26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
  }
  header.top{
    background:var(--teal-dark); color:#fff; padding:22px 28px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header.top h1{margin:0; font-size:1.25rem; font-weight:700;}
  header.top .sub{font-size:.85rem; opacity:.8; margin-top:4px;}
  .home-btn{
    background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:8px; padding:8px 14px; cursor:pointer; font-size:.85rem;
  }
  .home-btn:hover{background:rgba(255,255,255,.22);}
  main{max-width:1100px; margin:0 auto; padding:28px 20px 60px;}

  /* ---- home grid ---- */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:20px;}
  .tile{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 18px;
    cursor:pointer; text-align:center; transition:transform .15s, box-shadow .15s;
  }
  .tile:hover{transform:translateY(-3px); box-shadow:0 10px 22px rgba(15,92,86,.12);}
  .tile .icon{font-size:1.8rem; margin-bottom:8px;}
  .tile .name{font-weight:700; font-size:1.05rem;}
  .tile .hint{font-size:.78rem; color:var(--muted); margin-top:4px;}
  .tile.manager{border-color:var(--gold);}

  /* ---- password modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(18,49,43,.55); display:flex;
    align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--card); border-radius:14px; padding:26px 24px; width:320px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal h3{margin:0 0 6px;}
  .modal p{margin:0 0 16px; color:var(--muted); font-size:.85rem;}
  .modal input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:1rem; margin-bottom:10px;
  }
  .modal .err{color:var(--red-fg); font-size:.8rem; min-height:1.1em; margin-bottom:8px;}
  .row-btns{display:flex; gap:8px;}
  .btn{
    border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-size:.9rem; font-weight:600;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-secondary{background:#eee; color:var(--ink);}
  .btn-secondary:hover{background:#e2e2e2;}
  .btn-danger{background:var(--red-bg); color:var(--red-fg);}
  .btn-gold{background:var(--gold); color:#fff;}

  /* ---- page shell ---- */
  .page-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .page-title h2{margin:0;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap;}

  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden;}
  th,td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:center; font-size:.9rem;}
  th{background:var(--teal); color:#fff; font-weight:600; position:sticky; top:0;}
  tr:last-child td{border-bottom:none;}
  td input[type=number], td input[type=text]{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:.9rem; text-align:center;
  }
  td select{width:100%; padding:6px 6px; border:1px solid var(--line); border-radius:6px; font-size:.9rem;}
  .coverage-cell{font-weight:700; border-radius:6px; padding:6px 4px;}
  .cov-red{background:var(--red-bg); color:var(--red-fg);}
  .cov-yellow{background:var(--yellow-bg); color:var(--yellow-fg);}
  .cov-green{background:var(--green-bg); color:var(--green-fg);}
  .del-btn{background:none; border:none; color:var(--red-fg); cursor:pointer; font-size:1rem;}
  .table-wrap{max-height:65vh; overflow:auto; border-radius:12px; border:1px solid var(--line);}
  .empty-note{color:var(--muted); font-size:.85rem; margin-top:10px;}
  .materials-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
  .chip{
    background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    display:flex; align-items:center; gap:8px; font-size:.88rem;
  }
  .chip button{background:none; border:none; color:var(--red-fg); cursor:pointer; font-weight:700;}
  .add-row{display:flex; gap:8px; margin-top:6px;}
  .add-row input{flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px;}
  .status{font-size:.8rem; color:var(--muted); margin-top:10px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:14px 0; font-size:.82rem; color:var(--muted);}
  .legend span.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-inline-start:5px;}
  .info-box{background:#eef6f5; border:1px solid var(--teal); border-radius:10px; padding:12px 14px; font-size:.85rem; margin-bottom:16px; color:var(--teal-dark);}
  .file-input-wrap{display:inline-block;}
  .file-input-wrap input[type=file]{display:none;}
  .filelist{margin-top:10px; font-size:.82rem; color:var(--muted);}

  /* ---- header with emblem ---- */
  header.top{padding:18px 28px;}
  header.top .brand{display:flex; align-items:center; gap:14px;}
  header.top .brand img{width:46px; height:auto; display:block;}
  header.top .brand-text .org{font-size:.72rem; letter-spacing:.5px; opacity:.75; margin-top:2px;}
  .top-actions{display:flex; gap:8px;}

  /* ---- login screen ---- */
  .login-wrap{
    min-height:calc(100vh - 90px); display:flex; align-items:center; justify-content:center;
    padding:30px 16px;
  }
  .login-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 20px 55px rgba(15,92,86,.12); width:100%; max-width:420px;
    padding:34px 30px 28px; text-align:center;
  }
  .login-emblem{width:96px; height:auto; margin:0 auto 12px;}
  .login-card h1{margin:0; font-size:1.15rem; color:var(--teal-dark);}
  .login-card .org-name{font-weight:800; font-size:1.4rem; color:var(--ink); margin-top:6px;}
  .login-card .tagline{font-size:.82rem; color:var(--muted); margin:6px 0 24px;}
  .role-toggle{display:flex; gap:8px; margin-bottom:20px; background:var(--paper); border-radius:10px; padding:5px; border:1px solid var(--line);}
  .role-toggle button{
    flex:1; border:none; background:transparent; padding:10px 8px; border-radius:8px;
    font-size:.88rem; font-weight:700; color:var(--muted); cursor:pointer; transition:all .15s;
  }
  .role-toggle button.active{background:var(--teal); color:#fff;}
  .login-field{text-align:right; margin-bottom:14px;}
  .login-field label{display:block; font-size:.82rem; font-weight:600; color:var(--ink); margin-bottom:6px;}
  .login-field select, .login-field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:.95rem;
    font-family:inherit; background:#fff;
  }
  .login-card .btn-primary{width:100%; padding:12px; font-size:.95rem; margin-top:6px;}
  .login-err{color:var(--red-fg); font-size:.82rem; min-height:1.2em; margin-top:10px;}
  .login-footer{margin-top:22px; font-size:.72rem; color:var(--muted); border-top:1px solid var(--line); padding-top:14px;}
  .login-credit{margin-top:8px; font-size:.68rem; color:var(--muted); opacity:.7;}

  /* ---- collapsible chart section (materials page) ---- */
  .chart-section{margin-top:26px;}
  .chart-section > summary{
    cursor:pointer; font-weight:700; color:var(--teal-dark); padding:12px 16px;
    background:var(--card); border:1px solid var(--line); border-radius:10px; list-style:none;
  }
  .chart-section > summary::-webkit-details-marker{display:none;}
  .chart-section > summary::before{content:"▸ "; }
  .chart-section[open] > summary::before{content:"▾ "; }
  .chart-body{margin-top:14px; max-height:70vh; overflow:auto; padding-right:4px;}

  /* ---- combined vertical chart (materials page) ---- */
  .vchart-legend{display:flex; gap:16px; font-size:.78rem; color:var(--muted); margin-bottom:10px;}
  .vchart-legend .dot{width:10px; height:10px; border-radius:3px; display:inline-block; margin-inline-end:5px; vertical-align:-1px;}
  .vchart-wrap{overflow-x:auto; padding:26px 8px 10px; background:var(--card); border:1px solid var(--line); border-radius:12px;}
  .vchart{display:flex; align-items:flex-end; gap:26px; min-height:230px;}
  .vchart-item{display:flex; flex-direction:column; align-items:center; min-width:82px;}
  .vchart-bars{display:flex; align-items:flex-end; gap:6px; height:190px;}
  .vchart-bar{width:22px; border-radius:5px 5px 0 0; position:relative; min-height:2px;}
  .vchart-bar.avail{background:var(--teal);}
  .vchart-bar.need{background:var(--gold);}
  .vchart-val{position:absolute; top:-20px; left:50%; transform:translateX(-50%); font-size:.68rem; font-weight:700; color:var(--ink); white-space:nowrap;}
  .vchart-label{margin-top:10px; font-size:.75rem; text-align:center; color:var(--ink); max-width:96px; line-height:1.3;}
  .vchart-cov{margin-top:6px; font-size:.68rem; padding:2px 8px;}

  /* ---- material movement sub-page ---- */
  .summary-cards{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .summary-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 20px; min-width:150px; text-align:center;}
  .summary-card .val{font-size:1.35rem; font-weight:800; color:var(--teal-dark);}
  .summary-card .lbl{font-size:.75rem; color:var(--muted); margin-top:3px;}
  .movement-forms{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:26px;}
  @media (max-width:700px){ .movement-forms{grid-template-columns:1fr;} }
  .movement-form{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .movement-form.in{border-top:4px solid var(--teal);}
  .movement-form.out{border-top:4px solid var(--gold);}
  .movement-form h3{margin:0 0 12px; font-size:1rem;}
  .movement-form label{display:block; font-size:.8rem; font-weight:600; margin:10px 0 5px; color:var(--ink);}
  .movement-form input{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:.9rem; font-family:inherit;}
  .movement-form button{width:100%; margin-top:16px;}
  .mov-btn{background:none; border:1px solid var(--teal); color:var(--teal); border-radius:7px; padding:5px 10px; cursor:pointer; font-size:.8rem; margin-inline-end:4px; font-weight:600;}
  .mov-btn:hover{background:var(--teal); color:#fff;}
  .mov-type{font-weight:700; border-radius:6px; padding:4px 10px; font-size:.78rem;}
  .mov-type.in{background:var(--green-bg); color:var(--green-fg);}
  .mov-type.out{background:var(--red-bg); color:var(--red-fg);}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="logo.png" alt="شعار الجمهورية العربية السورية">
    <div class="brand-text">
      <h1>مديرية صحة طرطوس</h1>
      <div class="org">الجمهورية العربية السورية</div>
    </div>
  </div>
  <div class="top-actions">
    <button class="home-btn" id="homeBtn" style="display:none">🏠 القائمة الرئيسية</button>
    <button class="home-btn" id="logoutBtn" style="display:none">🚪 تسجيل خروج</button>
  </div>
</header>
<main id="app"></main>

<script>
const DEPTS = [1,2,3,4,5];
const DEPT_NAMES = {
  1: "خدمات طبية",
  2: "المشفى الوطني",
  3: "مشفى الأطفال",
  4: "مشفى بانياس",
  5: "مشفى التوليد"
};
const DEPT_ACCOUNTS = {
  1: {full:"Ware1F#2026", limited:"Ware1L#2026"},
  2: {full:"Ware2F#2026", limited:"Ware2L#2026"},
  3: {full:"Ware3F#2026", limited:"Ware3L#2026"},
  4: {full:"Ware4F#2026", limited:"Ware4L#2026"},
  5: {full:"Ware5F#2026", limited:"Ware5L#2026"}
};
const MANAGER_PASSWORD = "Manager#2026";

const app = document.getElementById("app");
const homeBtn = document.getElementById("homeBtn");
const logoutBtn = document.getElementById("logoutBtn");

let session = null; // {role:"manager"} or {role:"dept", n:1}

homeBtn.onclick = () => { if(session && session.role==="manager") renderManagerHome(); };
logoutBtn.onclick = () => { session = null; renderLogin(); };

function setNav(showHome){
  homeBtn.style.display = showHome ? "inline-block" : "none";
  logoutBtn.style.display = session ? "inline-block" : "none";
}

// ---------- storage helpers (local to this device/browser only) ----------
function storGet(key){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function storSet(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  }catch(e){ console.error("storage set failed", e); return false; }
}

function coverage(need, available){
  const n = Number(need), a = Number(available);
  if(!need || isNaN(n) || n===0) return null;
  return a / n;
}
function coverageClass(v){
  if(v===null || v===undefined || isNaN(v)) return "";
  if(v<=3) return "cov-red";
  if(v<=6) return "cov-yellow";
  return "cov-green";
}
function fmtCov(v){
  if(v===null || v===undefined || isNaN(v)) return "—";
  return v.toFixed(1);
}
function uid(){ return "r"+Date.now()+Math.random().toString(16).slice(2,8); }

// materials are stored as {name, unit}; these helpers also accept legacy plain-string entries
function matName(m){ return typeof m === "string" ? m : (m && m.name) || ""; }
function matUnit(m){ return typeof m === "string" ? "" : (m && m.unit) || ""; }
function unitForMaterial(materialsArr, name){
  const found = (materialsArr || []).find(m => matName(m) === name);
  return found ? matUnit(found) : "";
}

function confirmAction(message, onConfirm, opts = {}){
  const title = opts.title || "تأكيد الحذف";
  const yesLabel = opts.yesLabel || "نعم، احذف";
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <p>${message}</p>
      <div class="row-btns">
        <button class="btn btn-danger" id="confirmYes">${yesLabel}</button>
        <button class="btn btn-secondary" id="confirmNo">لا</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => document.body.removeChild(overlay);
  overlay.querySelector("#confirmYes").onclick = () => { close(); onConfirm(); };
  overlay.querySelector("#confirmNo").onclick = close;
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
}

// ---------- server sync helpers (shared across devices via Cloudflare KV) ----------
async function apiGet(path){
  try{
    const res = await fetch(path);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function apiPost(path, data){
  try{
    const res = await fetch(path, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(data)
    });
    return res.ok;
  }catch(e){ return false; }
}

// aggregates avail/need per material across all 5 sheets — used by manager report AND materials chart
async function fetchDeptSnapshot(){
  const [deptResults, materialsList] = await Promise.all([
    Promise.all(DEPTS.map(n => apiGet(`/api/dept/${n}`))),
    apiGet(`/api/materials`)
  ]);
  let anyFailed = false;
  const deptData = {};
  DEPTS.forEach((n, idx) => {
    if(deptResults[idx] === null){ anyFailed = true; }
    else{ deptData[n] = deptResults[idx]; }
  });
  const totalsMap = {};
  const filledDepts = [];
  DEPTS.forEach(n=>{
    const rows = deptData[n] || [];
    if(rows.length) filledDepts.push(n);
    rows.forEach(r=>{
      if(!r.material) return;
      if(!totalsMap[r.material]) totalsMap[r.material] = {avail:0, need:0};
      totalsMap[r.material].avail += Number(r.available)||0;
      totalsMap[r.material].need += Number(r.need)||0;
    });
  });
  const totals = Object.keys(totalsMap).map(mat=>({
    mat, unit: unitForMaterial(materialsList||[], mat), ...totalsMap[mat]
  }));
  return {totals, filledDepts, anyFailed};
}

// single combined vertical bar chart for all materials at once
function renderVerticalChart(totals){
  if(!totals.length) return `<p class="empty-note">لا توجد بيانات كافية لعرض المخطط بعد.</p>`;
  const maxVal = Math.max(1, ...totals.flatMap(t=>[t.avail, t.need]));
  const bars = totals.map(t=>{
    const cov = t.need>0 ? t.avail/t.need : null;
    const availH = Math.round((t.avail/maxVal)*100);
    const needH = Math.round((t.need/maxVal)*100);
    return `
      <div class="vchart-item">
        <div class="vchart-bars">
          <div class="vchart-bar avail" style="height:${availH}%"><span class="vchart-val">${t.avail}</span></div>
          <div class="vchart-bar need" style="height:${needH}%"><span class="vchart-val">${t.need}</span></div>
        </div>
        <div class="vchart-label">${t.mat}${t.unit ? `<br><span style="opacity:.6">(${t.unit})</span>` : ""}</div>
        <span class="coverage-cell ${coverageClass(cov)} vchart-cov">${fmtCov(cov)}</span>
      </div>`;
  }).join("");
  return `
    <div class="vchart-legend">
      <span><span class="dot" style="background:var(--teal)"></span>متوفر</span>
      <span><span class="dot" style="background:var(--gold)"></span>احتياج</span>
    </div>
    <div class="vchart-wrap"><div class="vchart">${bars}</div></div>`;
}

// ---------- Excel helpers ----------
function downloadWorkbook(wb, filename){
  XLSX.writeFile(wb, filename);
}
function rowsToWorksheet(rows, materials){
  const data = rows.map((r,i)=>({
    "تسلسل": i+1,
    "اسم المادة": r.material || "",
    "الوحدة": unitForMaterial(materials || [], r.material) || "",
    "الاحتياج": r.need || "",
    "العدد المتوفر": r.available || "",
    "ملاحظات": r.notes || ""
  }));
  return XLSX.utils.json_to_sheet(data);
}
function readExcelFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:"array"});
        resolve(wb);
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// ---------- LOGIN SCREEN ----------
function renderLogin(){
  setNav(false);
  let role = "manager"; // "manager" | "dept"

  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <img class="login-emblem" src="logo.png" alt="شعار الجمهورية العربية السورية">
        <h1>الجمهورية العربية السورية</h1>
        <div class="org-name">مديرية صحة طرطوس</div>
        <div class="tagline">نظام إدارة احتياج وتوافر المواد</div>

        <div class="role-toggle">
          <button type="button" id="roleManager" class="active">مدير</button>
          <button type="button" id="roleDept">مستخدم</button>
        </div>

        <div id="deptSelectField" class="login-field" style="display:none">
          <label>اختر الورقة</label>
          <select id="deptSelect">
            ${DEPTS.map(n=>`<option value="${n}">${DEPT_NAMES[n]}</option>`).join("")}
          </select>
        </div>

        <div class="login-field">
          <label>كلمة السر</label>
          <input type="password" id="loginPw" placeholder="أدخل كلمة السر">
        </div>

        <button class="btn btn-primary" id="loginBtn">دخول</button>
        <div class="login-err" id="loginErr"></div>

        <div class="login-footer">الدخول محمي بكلمة سر خاصة بكل جهة — يرجى عدم مشاركتها.</div>
        <div class="login-credit">برمجة وتطوير دائرة التقانة والتحول الرقمي - 2026</div>
      </div>
    </div>`;

  const roleManagerBtn = document.getElementById("roleManager");
  const roleDeptBtn = document.getElementById("roleDept");
  const deptField = document.getElementById("deptSelectField");
  const pwInput = document.getElementById("loginPw");
  const errEl = document.getElementById("loginErr");

  function setRole(r){
    role = r;
    roleManagerBtn.classList.toggle("active", r==="manager");
    roleDeptBtn.classList.toggle("active", r==="dept");
    deptField.style.display = r==="dept" ? "block" : "none";
    errEl.textContent = "";
  }
  roleManagerBtn.onclick = ()=>setRole("manager");
  roleDeptBtn.onclick = ()=>setRole("dept");

  function tryLogin(){
    const pw = pwInput.value;
    if(role==="manager"){
      if(pw === MANAGER_PASSWORD){
        session = {role:"manager"};
        renderManagerHome();
      }else{
        errEl.textContent = "كلمة السر غير صحيحة";
      }
    }else{
      const n = Number(document.getElementById("deptSelect").value);
      const acc = DEPT_ACCOUNTS[n];
      if(pw === acc.full){
        session = {role:"dept", n, perm:"full"};
        renderDept(n);
      }else if(pw === acc.limited){
        session = {role:"dept", n, perm:"limited"};
        renderDept(n);
      }else{
        errEl.textContent = "كلمة السر غير صحيحة";
      }
    }
    pwInput.value = "";
  }
  document.getElementById("loginBtn").onclick = tryLogin;
  pwInput.addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
  pwInput.focus();
}

      <div class="chart-body" id="chartBody"><p class="empty-note">جارٍ تحميل البيانات...</p></div>
    </details>`;

  let materials = storGet("materials") || [];
  let syncNote = "";
  drawMatList();

  document.getElementById("newMatUnit").addEventListener("change", (e)=>{
    document.getElementById("newMatUnitOther").style.display = e.target.value === "__other__" ? "block" : "none";
  });

  (async ()=>{
    const server = await apiGet(`/api/materials`);
    if(server){ materials = server; storSet("materials", materials); drawMatList(); }
  })();

  let saveTimer = null;
  function syncToServer(){
    clearTimeout(saveTimer);
    syncNote = "🔄 جارٍ الحفظ...";
    drawStatus();
    saveTimer = setTimeout(async ()=>{
      const ok = await apiPost(`/api/materials`, materials);
      syncNote = ok ? "✅ محفوظة ومتزامنة مع الجميع" : "⚠️ تعذّر الاتصال بالسيرفر — محفوظة محليًا فقط حاليًا";
      drawStatus();
    }, 500);
  }
  function drawStatus(){
    const el = document.getElementById("matStatus");
    if(el) el.textContent = `عدد المواد الحالي: ${materials.length}` + (syncNote ? ` — ${syncNote}` : "");
  }

  function drawMatList(){
    const list = document.getElementById("matList");
    list.innerHTML = materials.length ? materials.map((m,i)=>`
      <div class="chip">${matName(m)}${matUnit(m) ? ` <span style="opacity:.6">(${matUnit(m)})</span>` : ""} <button data-i="${i}">✕</button></div>
    `).join("") : `<p class="empty-note">لا توجد مواد بعد. أضف أول مادة أعلاه أو استورد ملف Excel.</p>`;
    list.querySelectorAll("button[data-i]").forEach(b=>{
      b.onclick = ()=>{
        const idx = Number(b.dataset.i);
        const mName = matName(materials[idx]);
        confirmAction(`هل أنت متأكد من حذف المادة "${mName}"؟`, ()=>{
          materials.splice(idx,1);
          storSet("materials", materials);
          drawMatList();
          syncToServer();
        });
      };

    drawStatus();
  }

  document.getElementById("addMat").onclick = ()=>{
    const inp = document.getElementById("newMat");
    const v = inp.value.trim();
    if(!v) return;
    if(materials.some(m=>matName(m)===v)){ inp.value=""; return; }
    const unitSel = document.getElementById("newMatUnit").value;
    const unitOther = document.getElementById("newMatUnitOther").value.trim();
    const unit = unitSel === "__other__" ? unitOther : unitSel;
    materials.push({name:v, unit: unit || ""});
    storSet("materials", materials);
    inp.value = "";
    document.getElementById("newMatUnitOther").value = "";
    drawMatList();
    syncToServer();
  };
  document.getElementById("newMat").addEventListener("keydown", e=>{
    if(e.key==="Enter") document.getElementById("addMat").click();
  });

    const ws = XLSX.utils.json_to_sheet(materials.map(m=>({"اسم المادة": matName(m), "الوحدة": matUnit(m)})));

    downloadWorkbook(wb, "قائمة_المواد.xlsx");
  };
  document.getElementById("importMatBtn").onclick = ()=>document.getElementById("importMat").click();
  document.getElementById("importMat").addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const wb = await readExcelFile(file);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      const items = data.map(row => ({
        name: String(row["اسم المادة"] || row["المادة"] || Object.values(row)[0] || "").trim(),
        unit: String(row["الوحدة"] || "").trim()
      })).filter(it => it.name);
      let added = 0;
      items.forEach(it=>{
        if(!materials.some(m=>matName(m)===it.name)){ materials.push({name:it.name, unit:it.unit}); added++; }
      });
      storSet("materials", materials);
      drawMatList();
      syncToServer();
    }catch(err){
      alert("تعذّر قراءة الملف، تأكد إنه ملف Excel صحيح.");
    }
    e.target.value = "";
  });

  const chartSection = document.getElementById("chartSection");
  let chartLoaded = false;
  chartSection.addEventListener("toggle", async ()=>{
    if(chartSection.open && !chartLoaded){
      chartLoaded = true;
      const {totals} = await fetchDeptSnapshot();
      document.getElementById("chartBody").innerHTML = renderVerticalChart(totals);
    }
  });
}

function renderDept(n){
  setNav(session && session.role==="manager");
  const perm = (session && session.role==="manager") ? "full" : (session ? session.perm : "full");
  const permLabel = perm==="full"
    ? `<span style="font-size:.72rem; background:var(--green-bg); color:var(--green-fg); padding:3px 9px; border-radius:999px; font-weight:700;">صلاحية كاملة</span>`

      <h2>${DEPT_NAMES[n]} - احتياج وتوافر المواد ${permLabel}</h2>

        ${perm==="full" ? `<button class="btn btn-secondary" id="addRow">+ إضافة صف</button>` : ""}

    </div>
    <div class="info-box">بياناتك تُحفظ وتُرسل تلقائيًا لصفحة المدير فور التعديل، بدون أي حاجة لإرسال ملفات.${
      perm==="limited" ? "<br>ملاحظة: صلاحيتك تسمح فقط بتسجيل حركة إدخال/إخراج على المواد الموجودة عبر زر \"🔁 حركة\" — لا يمكنك تعديل الصفوف مباشرة أو حذفها أو إضافة مواد جديدة." : ""
    }</div>

      <span>مستوى الكفاية:</span>

      <span>أصفر (3-6 أشهر)<span class="dot" style="background:var(--yellow-bg);border:1px solid var(--yellow-fg)"></span></span>
      <span>أخضر (أكثر من 6 أشهر)<span class="dot" style="background:var(--green-bg);border:1px solid var(--green-fg)"></span></span>
    </div>

      <table>
        <thead><tr>
          <th>تسلسل</th><th>اسم المادة</th><th>الوحدة</th><th>الاحتياج</th><th>العدد المتوفر</th><th>الكفاية</th><th>ملاحظات</th><th>إجراءات</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="status" id="deptStatus">جارٍ تحميل البيانات...</p>`;

  let materials = storGet("materials") || [];
  let rows = storGet(`dept_${n}`) || [];
  let syncNote = "";
  draw();

  // load latest from server (other device may have saved data for this dept before)
  (async ()=>{
    const serverMats = await apiGet(`/api/materials`);
    if(serverMats){ materials = serverMats; storSet("materials", materials); }
    const serverRows = await apiGet(`/api/dept/${n}`);
    if(serverRows){ rows = serverRows; storSet(`dept_${n}`, rows); }
    draw();
  })();

  function draw(){
    const tbody = document.getElementById("tbody");
    const editable = perm === "full";
    tbody.innerHTML = rows.map((r,i)=>{
      const cov = coverage(r.need, r.available);
      const unit = unitForMaterial(materials, r.material);
      const matCell = editable
        ? `<select class="f-mat">
              <option value="">— اختر —</option>
              ${materials.map(m=>`<option value="${matName(m)}" ${matName(m)===r.material?"selected":""}>${matName(m)}</option>`).join("")}
            </select>`
        : `<span>${r.material || "—"}</span>`;
      const needCell = editable
        ? `<input type="number" min="0" class="f-need" value="${r.need ?? ""}">`
        : `<span>${r.need ?? "—"}</span>`;
      const availCell = editable
        ? `<input type="number" min="0" class="f-avail" value="${r.available ?? ""}">`
        : `<span>${r.available ?? "—"}</span>`;
      const notesCell = editable
        ? `<input type="text" class="f-notes" value="${r.notes ?? ""}">`
        : `<span>${r.notes ?? ""}</span>`;
      const actions = `
        <button class="mov-btn" title="حركة إدخال/إخراج المادة" data-mov="${r.id}">🔁 حركة</button>
        ${editable ? `<button class="del-btn" title="حذف الصف">🗑</button>` : ""}`;
      return `<tr data-i="${i}">
        <td>${i+1}</td>
        <td>${matCell}</td>
        <td>${unit || "—"}</td>
        <td>${needCell}</td>
        <td>${availCell}</td>
        <td><span class="coverage-cell ${coverageClass(cov)}">${fmtCov(cov)}</span></td>
        <td>${notesCell}</td>
        <td>${actions}</td>
      </tr>`;
    }).join("");

    if(!rows.length){
      tbody.innerHTML = `<tr><td colspan="8" class="empty-note">لا توجد صفوف بعد.${editable ? ' اضغط "+ إضافة صف" للبدء.' : ''}</td></tr>`;
    }
    document.getElementById("deptStatus").textContent = `عدد الصفوف: ${rows.length}` +
      (materials.length ? "" : " — ملاحظة: قائمة المواد فارغة.") +
      (syncNote ? ` — ${syncNote}` : "");

    tbody.querySelectorAll("tr[data-i]").forEach(tr=>{
      const i = Number(tr.dataset.i);
      const matEl = tr.querySelector(".f-mat");
      if(matEl) matEl.onchange = e=>{ rows[i].material = e.target.value; save(); draw(); };
      const needEl = tr.querySelector(".f-need");
      if(needEl) needEl.oninput = e=>{ rows[i].need = e.target.value; save(); redrawCoverage(tr,i); };
      const availEl = tr.querySelector(".f-avail");
      if(availEl) availEl.oninput = e=>{ rows[i].available = e.target.value; save(); redrawCoverage(tr,i); };
      const notesEl = tr.querySelector(".f-notes");
      if(notesEl) notesEl.oninput = e=>{ rows[i].notes = e.target.value; save(); };
      const delBtn = tr.querySelector(".del-btn");
      if(delBtn) delBtn.onclick = ()=>{
        confirmAction(`هل أنت متأكد من حذف هذا الصف${rows[i].material ? ` ("${rows[i].material}")` : ""}؟`, ()=>{
          rows.splice(i,1); save(); draw();
        });
      };
      const movBtn = tr.querySelector("[data-mov]");
      if(movBtn) movBtn.onclick = ()=> renderMovement(n, movBtn.dataset.mov);
    });
  }

  function redrawCoverage(tr,i){
    const cov = coverage(rows[i].need, rows[i].available);
    const cell = tr.querySelector(".coverage-cell");
    cell.className = "coverage-cell " + coverageClass(cov);
    cell.textContent = fmtCov(cov);
  }

  let saveTimer = null;
  function save(){
    storSet(`dept_${n}`, rows);
    syncNote = "🔄 جارٍ الحفظ على السيرفر...";
    document.getElementById("deptStatus") && (document.getElementById("deptStatus").textContent =
      `عدد الصفوف: ${rows.length} — ${syncNote}`);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const ok = await apiPost(`/api/dept/${n}`, rows);
      syncNote = ok ? "✅ محفوظ ومتزامن مع المدير" : "⚠️ تعذّر الاتصال بالسيرفر — البيانات محفوظة محليًا فقط حاليًا";
      const statusEl = document.getElementById("deptStatus");
      if(statusEl) statusEl.textContent = `عدد الصفوف: ${rows.length} — ${syncNote}`;
    }, 500);
  }

  const addRowBtn = document.getElementById("addRow");
  if(addRowBtn) addRowBtn.onclick = ()=>{
    rows.push({id:uid(), material:"", need:"", available:"", notes:"", movements:[]});
    save();
    draw();
  };

  document.getElementById("exportData").onclick = ()=>{
    const wb = XLSX.utils.book_new();
    const ws = rowsToWorksheet(rows, materials);
    XLSX.utils.book_append_sheet(wb, ws, DEPT_NAMES[n]);
    downloadWorkbook(wb, `${DEPT_NAMES[n]}.xlsx`);
  };
}

// ---------- MATERIAL MOVEMENT SUB-PAGE (stock in/out ledger for one row) ----------

  setNav(session && session.role==="manager");
  const perm = (session && session.role==="manager") ? "full" : (session ? session.perm : "full");
  let materials = storGet("materials") || [];
  let rows = storGet(`dept_${n}`) || [];
  let row = rows.find(r=>r.id===rowId);
  if(!row){ renderDept(n); return; }
  if(!Array.isArray(row.movements)) row.movements = [];
  const unit = unitForMaterial(materials, row.material);
  const canDeleteMov = perm === "full";
  const today = new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="page-title">
      <h2>حركة المادة: ${row.material || "—"}</h2>
      <div class="toolbar">
        <button class="btn btn-secondary" id="backBtn">⬅ رجوع لـ ${DEPT_NAMES[n]}</button>

    <div class="summary-cards">
      <div class="summary-card"><div class="val" id="curAvail">${row.available || 0}</div><div class="lbl">العدد المتوفر حاليًا${unit?` (${unit})`:""}</div></div>
      <div class="summary-card"><div class="val">${row.need || 0}</div><div class="lbl">الاحتياج${unit?` (${unit})`:""}</div></div>
    </div>

    <div class="movement-forms">
      <div class="movement-form in">
        <h3>📥 تسجيل إدخال</h3>
        <label>الكمية المدخلة${unit?` (${unit})`:""}</label>
        <input type="number" min="1" id="inQty">
        <label>تاريخ الإدخال</label>
        <input type="date" id="inDate" value="${today}">
        <label>مصدر المادة المدخلة</label>
        <input type="text" id="inSource" placeholder="مثال: التوريد المركزي / تبرع...">
        <button class="btn btn-primary" id="addInBtn">+ تسجيل الإدخال</button>
      </div>
      <div class="movement-form out">
        <h3>📤 تسجيل إخراج</h3>
        <label>الكمية المخرجة${unit?` (${unit})`:""}</label>
        <input type="number" min="1" id="outQty">
        <label>تاريخ الإخراج</label>
        <input type="date" id="outDate" value="${today}">
        <label>اسم المستلم</label>
        <input type="text" id="outRecipient" placeholder="اسم الجهة أو الشخص المستلم">
        <button class="btn btn-primary" id="addOutBtn">+ تسجيل الإخراج</button>
      </div>
    </div>

    <h3 style="margin:22px 0 10px;">سجل الحركة</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>التاريخ</th><th>النوع</th><th>الكمية</th><th>المصدر / المستلم</th>${canDeleteMov ? "<th></th>" : ""}</tr></thead>
        <tbody id="movTbody"></tbody>
      </table>
    </div>
    <p class="status" id="movStatus"></p>`;

  document.getElementById("backBtn").onclick = ()=> renderDept(n);

  let saveTimer = null;
  function persist(){
    storSet(`dept_${n}`, rows);
    const statusEl = document.getElementById("movStatus");
    if(statusEl) statusEl.textContent = "🔄 جارٍ الحفظ على السيرفر...";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      const ok = await apiPost(`/api/dept/${n}`, rows);
      const el = document.getElementById("movStatus");
      if(el) el.textContent = ok ? "✅ محفوظ ومتزامن مع المدير" : "⚠️ تعذّر الاتصال بالسيرفر — محفوظ محليًا فقط حاليًا";
    }, 400);
  }

  function drawSummary(){
    const el = document.getElementById("curAvail");
    if(el) el.textContent = row.available || 0;
  }

  function drawMovTable(){
    const tbody = document.getElementById("movTbody");
    const list = [...row.movements].sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.ts||0)-(a.ts||0));
    tbody.innerHTML = list.length ? list.map(mv=>`
      <tr data-mid="${mv.id}">
        <td>${mv.date || "—"}</td>
        <td><span class="mov-type ${mv.type}">${mv.type==="in" ? "إدخال" : "إخراج"}</span></td>
        <td>${mv.qty}${unit ? " "+unit : ""}</td>
        <td>${mv.party || "—"}</td>
        ${canDeleteMov ? `<td><button class="del-btn" data-delmov="${mv.id}" title="حذف الحركة">🗑</button></td>` : ""}
      </tr>`).join("") : `<tr><td colspan="${canDeleteMov?5:4}" class="empty-note">لا توجد حركات مسجّلة بعد.</td></tr>`;

    if(canDeleteMov){
      tbody.querySelectorAll("[data-delmov]").forEach(b=>{
        b.onclick = ()=>{
          const mid = b.dataset.delmov;
          confirmAction("هل أنت متأكد من حذف هذه الحركة؟ سيتم تعديل العدد المتوفر تبعًا لذلك.", ()=>{
            const idx = row.movements.findIndex(m=>m.id===mid);
            if(idx<0) return;
            const mv = row.movements[idx];
            row.available = (Number(row.available)||0) + (mv.type==="out" ? mv.qty : -mv.qty);
            row.movements.splice(idx,1);
            persist(); drawMovTable(); drawSummary();
          });
        };
      });
    }
  }
  drawMovTable();

  document.getElementById("addInBtn").onclick = ()=>{
    const qty = Number(document.getElementById("inQty").value);
    const date = document.getElementById("inDate").value;
    const source = document.getElementById("inSource").value.trim();
    if(!qty || qty<=0){ alert("الرجاء إدخال كمية صحيحة أكبر من صفر."); return; }
    if(!date){ alert("الرجاء تحديد تاريخ الإدخال."); return; }
    row.movements.push({id:uid(), type:"in", qty, date, party:source, ts:Date.now()});
    row.available = (Number(row.available)||0) + qty;
    persist(); drawMovTable(); drawSummary();
    document.getElementById("inQty").value = "";
    document.getElementById("inSource").value = "";
  };

  document.getElementById("addOutBtn").onclick = ()=>{
    const qty = Number(document.getElementById("outQty").value);
    const date = document.getElementById("outDate").value;
    const recipient = document.getElementById("outRecipient").value.trim();
    if(!qty || qty<=0){ alert("الرجاء إدخال كمية صحيحة أكبر من صفر."); return; }
    if(!date){ alert("الرجاء تحديد تاريخ الإخراج."); return; }
    const doAdd = ()=>{
      row.movements.push({id:uid(), type:"out", qty, date, party:recipient, ts:Date.now()});
      row.available = (Number(row.available)||0) - qty;
      persist(); drawMovTable(); drawSummary();
      document.getElementById("outQty").value = "";
      document.getElementById("outRecipient").value = "";
    };
    if((Number(row.available)||0) - qty < 0){
      confirmAction("الكمية المخرجة أكبر من العدد المتوفر حاليًا، وسيصبح الرصيد سالبًا. هل تريد المتابعة؟", doAdd,
        {title:"تأكيد الإخراج", yesLabel:"نعم، متابعة"});
    }else{
      doAdd();
    }
  };
}

// ---------- MANAGER PAGE ----------
function renderManager(){
  setNav(true);
  app.innerHTML = `<div class="page-title">
      <h2>تقرير المدير - مجمّع حسب المادة</h2>
      <div class="toolbar">
        <button class="btn btn-primary" id="refreshBtn">🔄 تحديث</button>
        <button class="btn btn-secondary" id="exportAll">📤 تصدير التقرير Excel</button>
      </div>
    </div>
    <div class="info-box">التقرير يُجمَّع تلقائيًا ولحظيًا من الأوراق الخمس — بدون الحاجة لأي استيراد يدوي.</div>
    <div class="filelist" id="fileList"></div>
    <div class="legend">
      <span>مستوى الكفاية:</span>
      <span>أحمر (0-3 أشهر)<span class="dot" style="background:var(--red-bg);border:1px solid var(--red-fg)"></span></span>
      <span>أصفر (3-6 أشهر)<span class="dot" style="background:var(--yellow-bg);border:1px solid var(--yellow-fg)"></span></span>
      <span>أخضر (أكثر من 6 أشهر)<span class="dot" style="background:var(--green-bg);border:1px solid var(--green-fg)"></span></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>تسلسل</th><th>اسم المادة</th><th>الوحدة</th><th>إجمالي العدد المتوفر</th><th>إجمالي الاحتياج</th><th>الكفاية الإجمالية</th>
        </tr></thead>
        <tbody id="mtbody"></tbody>
      </table>
    </div>
    <p class="status" id="mgrStatus">جارٍ التحميل من الأقسام...</p>`;

  let lastTotals = [];

  async function loadAll(){
    document.getElementById("mgrStatus").textContent = "جارٍ التحميل من الأقسام...";
    const {totals, filledDepts, anyFailed} = await fetchDeptSnapshot();
    lastTotals = totals;

    const tbody = document.getElementById("mtbody");
    if(!totals.length){
      tbody.innerHTML = `<tr><td colspan="6" class="empty-note">لا توجد بيانات بعد — ما في قسم أدخل بياناته حتى الآن.</td></tr>`;
    }else{
      tbody.innerHTML = totals.map((t,i)=>{
        const cov = t.need>0 ? t.avail/t.need : null;
        return `<tr>
          <td>${i+1}</td><td>${t.mat}</td><td>${t.unit || "—"}</td><td>${t.avail}</td><td>${t.need}</td>
          <td><span class="coverage-cell ${coverageClass(cov)}">${fmtCov(cov)}</span></td>
        </tr>`;
      }).join("");
    }
    const grandAvail = totals.reduce((s,t)=>s+t.avail,0);
    const grandNeed = totals.reduce((s,t)=>s+t.need,0);
    document.getElementById("mgrStatus").textContent =
      `إجمالي عام: العدد المتوفر ${grandAvail} — الاحتياج ${grandNeed} — عدد المواد ${totals.length}` +
      (anyFailed ? " — ⚠️ تعذّر الاتصال بالسيرفر لبعض الأقسام، جرّبي التحديث" : "");
    document.getElementById("fileList").textContent =
      `الأوراق التي أدخلت بيانات: ${filledDepts.length ? filledDepts.map(n=>DEPT_NAMES[n]).join("، ") : "لا يوجد بعد"}`;
  }

  document.getElementById("refreshBtn").onclick = loadAll;
  document.getElementById("exportAll").onclick = ()=>{
    const wb = XLSX.utils.book_new();
    const data = lastTotals.map((t,i)=>({
      "تسلسل": i+1,
      "اسم المادة": t.mat,
      "الوحدة": t.unit || "",
      "إجمالي العدد المتوفر": t.avail,
      "إجمالي الاحتياج": t.need,
      "الكفاية": t.need>0 ? (t.avail/t.need).toFixed(1) : "—"
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, "تقرير المدير");
    downloadWorkbook(wb, "تقرير_المدير.xlsx");
  };

  loadAll();
}

renderLogin();
</script>
